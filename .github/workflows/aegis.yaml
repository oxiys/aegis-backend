name: Aegis Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: oxiys/backend

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          base: ""
          head: HEAD
          extra_args: --only-verified

      - name: Source and dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Dockerfile configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: cyclonedx-sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom
          path: cyclonedx-sbom.json

      - name: Push the scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"

      - name: Sign image and attest SBOM with Cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --yes --key cosign.key "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          cosign attest --yes --key cosign.key --type cyclonedx --predicate cyclonedx-sbom.json "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          rm -f cosign.key

      - name: Explain release setup
        if: github.event_name != 'pull_request' && vars.RELEASE_ENABLED != 'true'
        run: |
          echo 'Build and scans completed. Follow README.md to configure secrets and enable RELEASE_ENABLED after the manifest migration is merged.' >> "$GITHUB_STEP_SUMMARY"

  update-manifests:
    needs: security-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the manifest repository
        uses: actions/checkout@v7
        with:
          repository: oxiys/aegis-app-manifests
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Update the backend image
        run: python3 scripts/update_image.py backend "$IMAGE_NAME:$GITHUB_SHA"

      - name: Commit and push the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/08-backend-deployment.yaml
          if git diff --cached --quiet; then
            echo 'Manifest already uses this image.'
            exit 0
          fi
          git commit -m "ci: update backend image to $GITHUB_SHA"
          # The other application repository can update its image concurrently.
          # Rebase only this manifest change, then retry a non-forced push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not push the manifest after five attempts.' >&2
          exit 1
